<!DOCTYPE html>
<html lang="tr">
<head>
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://api.github.com;">
<title>Admin – Site Koleksiyonum</title>
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<header>
  <h1>🔒 Yönetim Paneli</h1>
  <div class="header-actions">
    <button id="themeToggle" class="secondary" type="button">🌙</button>
    <a href="index.html" class="secondary" style="display:inline-flex;align-items:center;padding:0.7rem 1.2rem;border-radius:12px;text-decoration:none;color:inherit;font-weight:600;">← Site</a>
    <button id="logoutBtn" class="danger" type="button" style="display:none;">Çıkış</button>
  </div>
</header>

<main>
  <section id="loginSection" class="login-box">
    <div class="login-icon">🔐</div>
    <h2>Yönetici Girişi</h2>
    <p style="margin-bottom:1rem;color:var(--text-muted);">Fine-grained PAT girin. Token sadece bu sekmede tutulur.</p>
    <input type="password" id="patInput" placeholder="github_pat_..." style="text-align:center;margin-bottom:1rem;">
    <button id="loginBtn" type="button" style="width:100%;">Giriş Yap</button>
    <p id="loginError" class="status error"></p>
  </section>

  <section id="panelSection" style="display:none;">
    <div class="admin-hero">
      <h2>İçerik Yönetimi</h2>
      <p>Siteleri ekleyin, düzenleyin veya silin.</p>
    </div>

    <div class="admin-stats">
      <div class="admin-stat">
        <div class="admin-stat-icon">📚</div>
        <div><strong id="statTotal">0</strong><span>Toplam Site</span></div>
      </div>
      <div class="admin-stat">
        <div class="admin-stat-icon">🏷️</div>
        <div><strong id="statCategories">0</strong><span>Kategori</span></div>
      </div>
    </div>

    <form id="siteForm">
      <div class="form-header">
        <h3 id="formTitle">➕ Yeni Site Ekle</h3>
        <p id="formSubtitle">Tüm alanları doldurun, sonra kaydedin.</p>
      </div>
      <input type="hidden" id="siteId">
      <input type="text" id="title" placeholder="Başlık (örn. Google)" required maxlength="120">
      <input type="url" id="url" placeholder="https://example.com" required>
      <input type="text" id="category" placeholder="Kategori (örn. Blog)" maxlength="60">
      <textarea id="description" placeholder="Açıklama (opsiyonel)" maxlength="300"></textarea>
      <div class="char-counter" id="descCounter">0 / 300</div>
      <div class="actions">
        <button type="submit" id="submitBtn">Kaydet</button>
        <button type="button" id="cancelEdit" class="secondary" style="display:none;">İptal</button>
      </div>
    </form>

    <div class="admin-list-header">
      <h3>📋 Kayıtlı Siteler</h3>
      <div class="admin-controls">
        <input type="search" id="adminSearch" placeholder="🔍 Ara...">
        <select id="adminSort">
          <option value="date-desc">↓ En Yeni</option>
          <option value="date-asc">↑ En Eski</option>
          <option value="title-asc">A → Z</option>
        </select>
      </div>
    </div>
    
    <p id="panelStatus" class="status"></p>
    <section id="siteList" class="grid"></section>
  </section>
</main>

<div class="toast-container" id="toastContainer"></div>
<script src="admin.js?v=10"></script>
</body>
</html>
