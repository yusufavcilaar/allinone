<!DOCTYPE html>
<html lang="tr">
<head>
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4f46e5">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' https: data:;
               connect-src 'self' https://api.github.com;
               base-uri 'self';
               form-action 'self';">
<title>Admin – Site Koleksiyonum</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🔒 Yönetim Paneli</h1>
  <div class="header-actions">
    <button id="themeToggle" class="secondary" type="button" aria-label="Tema değiştir">🌙</button>
    <a href="index.html" class="secondary" style="display:inline-flex;align-items:center;gap:0.4rem;padding:0.7rem 1.2rem;border-radius:12px;text-decoration:none;color:inherit;font-weight:600;">← Site</a>
    <button id="logoutBtn" class="danger" type="button" style="display:none;">Çıkış</button>
  </div>
</header>

<main>
  <!-- Giriş -->
  <section id="loginSection" class="login-box">
    <h2>GitHub ile Giriş</h2>
    <p class="muted">
      Fine-grained PAT girin. Token <strong>sadece bu sekmede</strong> tutulur, sekme kapanınca silinir. PAT'ınızı asla paylaşmayın.
    </p>
    <input type="password" id="patInput" placeholder="github_pat_..." autocomplete="off" spellcheck="false">
    <button id="loginBtn" type="button">Giriş Yap</button>
    <p id="loginError" class="status error"></p>
  </section>

  <!-- Panel -->
  <section id="panelSection" style="display:none;">
    <div class="admin-stats">
      <div class="admin-stat"><strong id="statTotal">0</strong><span>Toplam Site</span></div>
      <div class="admin-stat"><strong id="statCategories">0</strong><span>Kategori</span></div>
      <div class="admin-stat"><strong id="statVisible">0</strong><span>Listelenen</span></div>
    </div>

    <form id="siteForm">
      <input type="hidden" id="siteId">
      <input type="text" id="title" placeholder="Başlık" required maxlength="120">
      <input type="url" id="url" placeholder="https://..." required>
      <input type="text" id="category" placeholder="Kategori (örn. Blog)" maxlength="60">
      <textarea id="description" placeholder="Açıklama (opsiyonel)" maxlength="300"></textarea>
      <div class="char-counter" id="descCounter">0 / 300</div>
      <div class="actions">
        <button type="submit" id="submitBtn">Ekle</button>
        <button type="button" id="cancelEdit" class="secondary" style="display:none;">İptal</button>
      </div>
    </form>

    <div class="admin-controls">
      <input type="search" id="adminSearch" placeholder="Site ara...">
      <select id="adminSort">
        <option value="date-desc">↓ En Yeni</option>
        <option value="date-asc">↑ En Eski</option>
        <option value="title-asc">A → Z</option>
        <option value="title-desc">Z → A</option>
      </select>
    </div>

    <p id="panelStatus" class="status"></p>
    <section id="siteList" class="grid"></section>
  </section>
</main>

<!-- Confirm modal -->
<div class="modal-overlay" id="confirmModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle">Onayla</h3>
    <p id="confirmMessage"></p>
    <div class="modal-actions">
      <button class="secondary" id="confirmCancel" type="button">İptal</button>
      <button class="danger" id="confirmOk" type="button">Sil</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer" aria-live="polite"></div>
<script src="admin.js"></script>
</body>
</html>
