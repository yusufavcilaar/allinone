<!DOCTYPE html>
<html lang="tr">
<head>
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self';">
<title>Site Koleksiyonum</title>
<link rel="stylesheet" href="style.css?v=99">
</head>
<body>
<header>
  <h1>🌐 Site Koleksiyonum</h1>
  <div class="header-actions">
    <button id="themeToggle" class="secondary" type="button">🌙</button>
  </div>
</header>

<main>
  <div class="hero-title">
    <h2>İşine Yarayacak Siteler</h2>
    <p>El ile seçilmiş, kategorilere ayrılmış faydalı web siteleri koleksiyonu.</p>
  </div>

  <div class="toolbar">
    <div class="search-wrapper">
      <input type="search" id="search" placeholder="Başlık, URL veya açıklama ara...">
    </div>
    <select id="sortBy">
      <option value="date-desc">↓ En Yeni</option>
      <option value="date-asc">↑ En Eski</option>
      <option value="title-asc">A → Z</option>
      <option value="title-desc">Z → A</option>
    </select>
  </div>

  <div id="categoryChips" style="display:flex;gap:0.5rem;margin-bottom:1.5rem;overflow-x:auto;padding-bottom:0.5rem;"></div>

  <section id="siteList" class="grid"></section>
</main>

<div class="toast-container" id="toastContainer"></div>
<script src="public.js?v=99"></script>
</body>
</html>
