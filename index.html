<!DOCTYPE html>
<html lang="tr">
<head>
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' https: data:;
               connect-src 'self';
               base-uri 'self';
               form-action 'self';">
<title>Site Koleksiyonum</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🌐 Site Koleksiyonum</h1>
  <button id="themeToggle" class="secondary" type="button">🌙 Tema</button>
</header>
<main>
  <div class="controls">
    <input type="search" id="search" placeholder="Ara (başlık, url, kategori, açıklama)...">
    <select id="categoryFilter"><option value="">Tüm Kategoriler</option></select>
  </div>

  <p id="status" class="status"></p>
  <section id="siteList" class="grid"></section>
</main>
<script src="public.js"></script>
</body>
</html>
